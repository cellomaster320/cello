<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CELLO MASTER v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 字體：Cinzel (標題/數字), Noto Serif TC (內文) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #1e1b18; 
            --bg-gradient-start: #2c241b; 
            --bg-gradient-end: #12100e; 
            
            --gold-primary: #c5a059; 
            --gold-glow: rgba(197, 160, 89, 0.3);
            
            --text-main: #e8e6e3; 
            --text-dim: #9ca3af;
            
            --glass-bg: rgba(30, 27, 24, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        * { -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 80%);
            font-family: 'Noto Serif TC', serif;
            height: 100dvh;
            overflow: hidden;
            font-size: 16px;
        }

        /* 字體定義 */
        .font-en, .font-num { font-family: 'Cinzel', serif; letter-spacing: 0.02em; }
        .font-zh { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }

        /* 強制數字/英文輸入框使用 Cinzel */
        input[type="date"], input[type="time"], input[type="number"], .font-cinzel-force {
            font-family: 'Cinzel', serif !important;
            font-weight: 700 !important;
            letter-spacing: 0.05em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* 卡片與容器 */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .glass-dock {
            background: rgba(18, 16, 14, 0.95);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
        }

        /* 輸入元件 */
        input, select, textarea {
            background-color: var(--input-bg) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            color: var(--text-main) !important;
            border-radius: 12px !important;
            transition: all 0.3s;
            font-size: 16px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold-primary) !important;
            background-color: rgba(0,0,0,0.5) !important;
            box-shadow: 0 0 0 1px rgba(197, 160, 89, 0.2);
        }
        ::placeholder { color: rgba(255, 255, 255, 0.25); font-family: 'Noto Serif TC', serif; font-weight: 400; }

        /* 按鈕與標籤 */
        .btn-gold {
            background: linear-gradient(135deg, #c5a059 0%, #8f7032 100%);
            color: #12100e;
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.25);
        }
        .btn-type.active {
            background: var(--gold-primary);
            color: #12100e;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }
        .btn-type {
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
        }

        /* 導航狀態 */
        .nav-btn.active i { color: var(--gold-primary); filter: drop-shadow(0 0 8px var(--gold-glow)); transform: scale(1.1); }
        .nav-btn.active span { color: var(--gold-primary); font-weight: 700; opacity: 1; }
        .nav-btn span { opacity: 0.5; transition: 0.3s; }
        .nav-btn i { transition: 0.3s; color: #71717a; }

        /* Checkbox */
        .toggle-checkbox {
            appearance: none; width: 22px; height: 22px;
            border: 2px solid #666; border-radius: 6px;
            display: grid; place-content: center; transition: 0.2s;
        }
        .toggle-checkbox::before {
            content: ""; width: 12px; height: 12px; transform: scale(0);
            background: var(--gold-primary); border-radius: 2px; transition: 0.2s;
        }
        .toggle-checkbox:checked { border-color: var(--gold-primary); }
        .toggle-checkbox:checked::before { transform: scale(1); }

        /* Animation */
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform: translateY(100%); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .hidden-tab { display: none; }
    </style>
</head>
<body class="flex flex-col">

    <!-- Header -->
    <header class="pt-[env(safe-area-inset-top,24px)] px-6 pb-4 flex justify-between items-end z-30 mt-2 bg-gradient-to-b from-[var(--bg-base)] to-transparent sticky top-0 flex-none">
        <div>
            <!-- 字體再放大 -->
            <h1 class="text-3xl font-bold font-en tracking-[0.1em] text-[#c5a059] drop-shadow-sm">CELLO MASTER</h1>
            <p class="text-xs text-[#7d6b53] font-zh tracking-[0.15em] mt-1 font-bold">音樂家專屬管家</p>
        </div>
        <!-- 右上角圈圈 - 功能化 -->
        <button onclick="openSettings()" class="w-11 h-11 rounded-full border border-white/10 flex items-center justify-center bg-white/5 active:scale-95 transition hover:bg-white/10 hover:border-[#c5a059]/50 shadow-lg">
            <i data-lucide="settings-2" size="20" class="text-zinc-400"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar px-5 pb-36 pt-2 relative" id="main-container">

        <!-- 1. SCHEDULE -->
        <div id="view-schedule" class="space-y-5 fade-in">
            <!-- Calendar Controls -->
            <div class="glass rounded-2xl p-3 flex items-center justify-between sticky top-0 z-20">
                <button onclick="changeViewDate(-7)" class="p-3 text-zinc-500 hover:text-[#c5a059] transition"><i data-lucide="chevron-left"></i></button>
                <div class="text-center">
                    <div id="cal-range" class="text-base text-[#c5a059] font-en tracking-widest font-bold">--</div>
                    <div id="cal-mode" class="text-xs text-zinc-600 font-num mt-0.5 font-bold">--</div>
                </div>
                <button onclick="changeViewDate(7)" class="p-3 text-zinc-500 hover:text-[#c5a059] transition"><i data-lucide="chevron-right"></i></button>
            </div>

            <!-- Date Grid: Days Bigger -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-2 mb-2"></div>

            <div id="schedule-list" class="space-y-4 min-h-[50vh] pb-10"></div>
        </div>

        <!-- 2. TEACHING (Student/School List) -->
        <div id="view-teaching" class="space-y-6 hidden-tab fade-in">
            <h2 class="text-xl font-bold text-zinc-200 font-zh tracking-widest mb-4 border-l-4 border-[#c5a059] pl-3">教學名單</h2>
            <div class="flex p-1.5 bg-black/20 rounded-xl mb-4 border border-white/5">
                <button onclick="filterTeaching('student', this)" class="flex-1 py-3 text-sm font-bold rounded-lg bg-[#c5a059] text-[#12100e] transition-all t-filter shadow-lg">個人學生</button>
                <button onclick="filterTeaching('school', this)" class="flex-1 py-3 text-sm font-bold rounded-lg text-zinc-500 hover:text-white transition-all t-filter">學校分部</button>
            </div>
            <div id="teaching-list" class="space-y-3 pb-20"></div>
        </div>

        <!-- 3. STAGE -->
        <div id="view-stage" class="space-y-6 hidden-tab fade-in">
            <h2 class="text-xl font-bold text-zinc-200 font-zh tracking-widest mb-4 border-l-4 border-[#c5a059] pl-3">演出行程</h2>
            <div id="stage-list" class="space-y-4 pb-20"></div>
        </div>

        <!-- 4. FINANCE -->
        <div id="view-finance" class="space-y-6 hidden-tab fade-in">
            <h2 class="text-xl font-bold text-zinc-200 font-zh tracking-widest mb-4 border-l-4 border-[#c5a059] pl-3">收支概覽</h2>
            
            <div class="w-full aspect-[2.4/1] rounded-[1.8rem] bg-gradient-to-br from-[#29221b] to-[#12100e] border border-[#c5a059]/20 p-6 relative overflow-hidden shadow-xl flex flex-col justify-between">
                <div class="absolute -right-8 -top-8 w-32 h-32 bg-[#c5a059]/10 rounded-full blur-[40px]"></div>
                <div class="relative z-10 flex justify-between items-start">
                    <span class="text-[10px] text-[#c5a059] border border-[#c5a059]/30 px-2 py-0.5 rounded font-en tracking-widest bg-[#c5a059]/5">本月概況</span>
                    <i data-lucide="trending-up" class="text-[#c5a059] opacity-80" size="20"></i>
                </div>
                <div class="relative z-10 flex justify-between items-end">
                    <div>
                        <div class="text-[10px] text-zinc-500 font-zh tracking-widest mb-1">待收款項</div>
                        <div id="fin-pending" class="text-3xl font-bold text-[#e8e6e3] font-num tracking-tight">NT$ 0</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-zinc-600 font-zh tracking-widest mb-1">已入帳</div>
                        <div id="fin-received" class="text-xl font-bold text-[#c5a059] font-num">NT$ 0</div>
                    </div>
                </div>
            </div>

            <div class="glass rounded-2xl p-5 border-t border-[#c5a059]/10">
                <h3 class="text-xs font-bold text-zinc-500 tracking-widest font-zh mb-4 flex items-center gap-2">
                    <i data-lucide="list-checks" size="14"></i> 帳務明細 (行程連動)
                </h3>
                <div id="finance-list" class="space-y-2"></div>
            </div>
        </div>

    </main>

    <!-- Bottom Dock -->
    <nav class="fixed bottom-6 left-4 right-4 h-[76px] glass-dock rounded-[2.5rem] flex justify-between items-center px-3 z-40 border border-[#c5a059]/10 shadow-2xl">
        <button onclick="switchTab('view-schedule', this)" class="nav-btn active flex-1 flex flex-col items-center gap-1 transition-all active:scale-95 group">
            <i data-lucide="calendar-days" size="22"></i>
            <span class="text-[10px] font-zh tracking-widest">行程</span>
        </button>
        <button onclick="switchTab('view-teaching', this)" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all active:scale-95 group">
            <i data-lucide="users" size="22"></i>
            <span class="text-[10px] font-zh tracking-widest">教學</span>
        </button>
        <div class="relative -top-8 mx-2">
            <button onclick="openActionSheet()" class="w-16 h-16 bg-gradient-to-br from-[#e0c080] to-[#8f7032] rounded-[1.5rem] rotate-45 flex items-center justify-center shadow-[0_8px_25px_rgba(197,160,89,0.3)] border-2 border-[#fff]/10 z-50 transition-all hover:scale-105 active:scale-95 hover:rotate-90 duration-300">
                <i data-lucide="plus" class="text-[#12100e] -rotate-45" size="32" stroke-width="3"></i>
            </button>
        </div>
        <button onclick="switchTab('view-stage', this)" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all active:scale-95 group">
            <i data-lucide="music" size="22"></i>
            <span class="text-[10px] font-zh tracking-widest">演出</span>
        </button>
        <button onclick="switchTab('view-finance', this)" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all active:scale-95 group">
            <i data-lucide="circle-dollar-sign" size="22"></i>
            <span class="text-[10px] font-zh tracking-widest">帳務</span>
        </button>
    </nav>

    <!-- Action Sheet -->
    <div id="action-sheet-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300" onclick="closeActionSheet()"></div>
    <div id="action-sheet" class="fixed bottom-0 left-0 right-0 bg-[#181614] rounded-t-[2.5rem] p-8 z-50 transform translate-y-full transition-transform duration-300 border-t border-[#c5a059]/20 shadow-2xl pb-12">
        <div class="w-12 h-1 bg-[#c5a059]/30 rounded-full mx-auto mb-8"></div>
        <div class="grid grid-cols-3 gap-4 mb-8">
            <button onclick="openProfileModal('student')" class="flex flex-col items-center gap-3 active:scale-95 transition bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-[#c5a059]/50 group">
                <div class="w-14 h-14 rounded-full bg-[#12100e] flex items-center justify-center text-blue-400 shadow-inner"><i data-lucide="user-plus" size="24"></i></div>
                <span class="text-sm font-zh text-zinc-300 font-bold group-hover:text-[#c5a059]">新增學生</span>
            </button>
            <button onclick="openProfileModal('school')" class="flex flex-col items-center gap-3 active:scale-95 transition bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-[#c5a059]/50 group">
                <div class="w-14 h-14 rounded-full bg-[#12100e] flex items-center justify-center text-emerald-400 shadow-inner"><i data-lucide="school" size="24"></i></div>
                <span class="text-sm font-zh text-zinc-300 font-bold group-hover:text-[#c5a059]">新增學校</span>
            </button>
            <button onclick="openEventModal()" class="flex flex-col items-center gap-3 active:scale-95 transition bg-white/5 p-4 rounded-2xl border border-white/5 hover:border-[#c5a059]/50 group">
                <div class="w-14 h-14 rounded-full bg-[#12100e] flex items-center justify-center text-[#c5a059] shadow-inner"><i data-lucide="calendar-plus" size="24"></i></div>
                <span class="text-sm font-zh text-zinc-300 font-bold group-hover:text-[#c5a059]">新增行程</span>
            </button>
        </div>
        <button onclick="closeActionSheet()" class="w-full py-4 text-zinc-500 font-en tracking-[0.2em] font-bold text-xs uppercase hover:text-white transition">CLOSE</button>
    </div>

    <!-- MODAL: EVENT -->
    <div id="modal-event" class="fixed inset-0 z-[60] hidden flex items-end sm:items-center justify-center px-0 sm:px-4 pb-0 sm:pb-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="closeModal('modal-event')"></div>
        <div class="relative bg-[#181614] w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl border border-[#c5a059]/20 max-h-[90vh] overflow-y-auto slide-up">
            
            <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                <h3 class="text-xl text-white font-bold font-zh tracking-wide" id="modal-event-title">新增行程</h3>
                <button onclick="closeModal('modal-event')" class="text-zinc-500 hover:text-white bg-white/5 p-2 rounded-full"><i data-lucide="x" size="20"></i></button>
            </div>

            <div class="space-y-6 pb-8">
                <input type="hidden" id="evt-type">
                <input type="hidden" id="evt-ref-id">

                <!-- 1. 類型選擇 -->
                <div class="grid grid-cols-2 gap-2 bg-black/30 p-1.5 rounded-xl border border-white/5">
                    <button onclick="setEventType('lesson', this)" class="btn-type active flex-1 py-3 rounded-lg text-xs font-bold font-zh transition-all">家教/學校</button>
                    <button onclick="setEventType('performance', this)" class="btn-type flex-1 py-3 rounded-lg text-xs font-bold font-zh transition-all">演出活動</button>
                </div>

                <!-- 2. 標題與對象 -->
                <div class="space-y-2">
                    <label id="lbl-title" class="text-xs text-[#c5a059] font-zh font-bold ml-1">行程標題</label>
                    <div id="section-student" class="relative hidden">
                        <select id="evt-student" onchange="autoFillStudent()" class="w-full p-4 rounded-2xl text-base font-zh appearance-none font-bold bg-[#24201c] border-white/10 focus:border-[#c5a059]">
                            <option value="">選擇學生/學校...</option>
                        </select>
                        <i data-lucide="chevron-down" size="18" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 pointer-events-none"></i>
                    </div>
                    <div id="section-title">
                        <input type="text" id="evt-title" placeholder="輸入主題" class="w-full p-4 rounded-2xl text-base font-zh font-bold bg-[#24201c]">
                    </div>
                </div>

                <!-- 3. 演出專屬：類型與穿搭 -->
                <div id="section-performance" class="hidden space-y-3 bg-white/5 p-4 rounded-2xl border border-dashed border-[#c5a059]/30">
                    <h4 class="text-xs text-[#c5a059] font-zh font-bold mb-2">演出細節</h4>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-zinc-400 font-zh block mb-1 ml-1">類型</label>
                            <select id="evt-perf-type" class="w-full p-3 rounded-xl text-sm font-zh bg-[#24201c]">
                                <option value="樂團">樂團</option>
                                <option value="商演">商演</option>
                                <option value="婚禮">婚禮</option>
                                <option value="演出">一般演出</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-zinc-400 font-zh block mb-1 ml-1">服裝建議 (Dress Code)</label>
                            <div class="relative">
                                <i data-lucide="shirt" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-[#c5a059]"></i>
                                <input type="text" id="evt-dress" placeholder="例如: 全黑" class="w-full p-3 pl-10 rounded-xl text-sm font-zh bg-[#24201c]">
                            </div>
                        </div>
                    </div>
                    
                    <div class="pt-3 border-t border-white/5 mt-2">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <span class="text-xs text-zinc-400 font-zh whitespace-nowrap">彩排場次</span>
                            <select id="evt-rehearsal-count" onchange="toggleRehearsalInputs()" class="p-2 rounded-lg text-sm bg-[#24201c] text-[#c5a059] font-bold border border-zinc-700 flex-1 font-num">
                                <option value="0">無彩排</option>
                                <option value="1">1 場</option>
                                <option value="2">2 場</option>
                                <option value="3">3 場</option>
                                <option value="4">4 場</option>
                                <option value="5">5 場</option>
                            </select>
                        </label>
                        <div id="rehearsal-inputs" class="mt-3 space-y-2 hidden"></div>
                    </div>
                </div>

                <!-- 4. 時間與日期 -->
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-[#c5a059] font-zh font-bold ml-1 block mb-1">日期</label>
                        <input type="date" id="evt-date" class="w-full rounded-2xl text-lg font-num p-3 font-bold bg-[#24201c]">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-[#c5a059] font-zh font-bold ml-1 block mb-1">開始時間</label>
                            <input type="time" id="evt-start" class="w-full rounded-2xl text-lg font-num p-3 text-center bg-[#24201c]">
                        </div>
                        <div>
                            <label class="text-xs text-[#c5a059] font-zh font-bold ml-1 block mb-1">結束時間</label>
                            <input type="time" id="evt-end" class="w-full rounded-2xl text-lg font-num p-3 text-center bg-[#24201c]">
                        </div>
                    </div>
                </div>

                <!-- 5. 地點 -->
                <div class="space-y-1">
                    <label class="text-xs text-[#c5a059] font-zh font-bold ml-1">地點</label>
                    <input type="text" id="evt-location" placeholder="輸入地點" class="w-full p-3 rounded-2xl text-sm font-zh bg-[#24201c]">
                </div>

                <!-- 6. 費用連動 -->
                <div class="bg-gradient-to-r from-[#2c241b] to-[#12100e] p-4 rounded-2xl border border-[#c5a059]/20 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-[#c5a059] font-zh flex items-center gap-1"><i data-lucide="link" size="12"></i> 財務連動</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="relative flex-1">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#c5a059] font-bold">$</span>
                            <input type="number" id="evt-fee" placeholder="0" class="w-full p-3 pl-6 rounded-xl text-2xl font-num font-bold text-right bg-black/30 border-[#c5a059]/30 text-white">
                        </div>
                        <input type="text" id="evt-fin-note" placeholder="備註 / 收款日" class="flex-[1.5] p-3 rounded-xl text-xs font-zh bg-black/30 text-zinc-300">
                    </div>
                </div>

                <!-- 7. 週期性 -->
                <div id="section-recur" class="flex items-center justify-between p-3 bg-white/5 rounded-2xl border border-white/5 hidden">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="evt-recur-check" class="toggle-checkbox" onchange="toggleRecurInput(this)">
                        <span class="text-sm text-zinc-300 font-zh font-bold">週期性行程</span>
                    </div>
                    <div class="flex items-center gap-3 transition-opacity duration-300 opacity-50" id="recur-input-group">
                        <span class="text-xs text-zinc-500 font-zh">重複</span>
                        <input type="number" id="evt-recur-weeks" value="1" disabled class="w-14 p-1 text-center rounded-lg text-sm bg-black/50 border border-zinc-600 text-[#c5a059] font-bold font-num" min="1" max="24">
                        <span class="text-xs text-zinc-500 font-zh">週</span>
                    </div>
                </div>

                <div class="flex gap-3 mt-6 pt-4 border-t border-white/10">
                    <button id="btn-delete-evt" onclick="deleteEvent()" class="hidden flex-1 py-4 bg-red-900/10 text-red-500 font-bold font-zh rounded-xl border border-red-500/30 hover:bg-red-900/30 transition">刪除</button>
                    <button onclick="saveEvent()" class="flex-[3] py-4 btn-gold rounded-xl font-zh text-sm shadow-lg hover:scale-[1.02] transition">確認儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: SETTINGS (全新大師控制台) -->
    <div id="modal-settings" class="fixed inset-0 z-[70] hidden flex items-center justify-center px-6 bg-black/90 backdrop-blur-md">

        <div class="relative bg-[#181614] w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl border border-[#c5a059]/20 max-h-[90vh] overflow-y-auto slide-up">

                <div class="grid grid-cols-2 gap-3">

    <div id="modal-sub" class="fixed inset-0 z-[60] hidden flex items-center justify-center px-6 bg-black/80 backdrop-blur-md">
        <div class="bg-[#16100a] w-full max-w-sm rounded-[2rem] p-6 border border-white/10 shadow-2xl slide-up max-h-[80vh] overflow-y-auto">
            <h3 class="text-lg text-white font-bold mb-4 font-zh flex items-center gap-2"><i data-lucide="users" class="text-red-400"></i> 代課人選管理</h3>
            <div class="flex gap-2 mb-4">
                <input id="sub-name" placeholder="姓名" class="flex-1 p-3 rounded-xl text-sm bg-black/20 border border-white/10">
                <input id="sub-phone" placeholder="電話" class="flex-1 p-3 rounded-xl text-sm bg-black/20 border border-white/10">
                <button onclick="addSub()" class="bg-[#D4AF37] p-3 rounded-xl text-black shadow-lg"><i data-lucide="plus" size="16"></i></button>
            </div>
            <div id="sub-list" class="space-y-2"></div>

    </div>

    <!-- LOGIC -->
    <script>
        // --- DATA ---
        let appData = { events: [], profiles: [], subs: [] };
        let viewDate = new Date();
        let editingEventId = null;
        let activeProfileId = null;
        let currentReportEventId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            refreshAll();
            lucide.createIcons();
        });

        function loadData() {
            const saved = localStorage.getItem('cello_os_v11');
            if(saved) appData = JSON.parse(saved);
        }
        function saveData() {
            localStorage.setItem('cello_os_v11', JSON.stringify(appData));
            refreshAll();
        }
        function refreshAll() {
            renderSchedule();
            renderTeaching();
            renderStage();
            renderFinance();
        }

        // --- SCHEDULE ---
        function changeViewDate(days) {
            viewDate.setDate(viewDate.getDate() + days);
            renderSchedule();
        }
        function renderSchedule() {
            const gridEl = document.getElementById('calendar-grid');
            const listEl = document.getElementById('schedule-list');
            const day = viewDate.getDay();
            const diff = viewDate.getDate() - day + (day == 0 ? -6 : 1);
            const monday = new Date(viewDate);
            monday.setDate(diff);
            
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            
            document.getElementById('cal-range').innerText = `${monday.toLocaleDateString('en-US',{month:'short',day:'numeric'})} - ${sunday.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
            document.getElementById('cal-mode').innerText = monday.getFullYear();

            gridEl.innerHTML = '';
            for(let i=0; i<7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const isSelected = dateStr === viewDate.toISOString().split('T')[0];
                const hasEvent = appData.events.some(e => e.date === dateStr);
                
                const btn = document.createElement('div');
                btn.className = `h-16 rounded-2xl flex flex-col items-center justify-center cursor-pointer border transition-all duration-300 ${isSelected ? 'bg-[#c5a059] border-[#c5a059] text-[#12100e] shadow-lg scale-105' : 'bg-white/5 border-white/5 text-zinc-500 hover:bg-white/10'}`;
                btn.onclick = () => { viewDate = new Date(dateStr); renderSchedule(); };
                btn.innerHTML = `<span class="text-[9px] font-en tracking-widest font-bold opacity-80">${d.toLocaleDateString('en-US',{weekday:'short'})}</span><span class="text-xl font-bold font-en leading-none mt-1">${d.getDate()}</span>${hasEvent ? `<div class="w-1 h-1 rounded-full ${isSelected?'bg-black':'bg-[#c5a059]'} mt-1"></div>`:''}`;
                gridEl.appendChild(btn);
            }

            const dateStr = viewDate.toISOString().split('T')[0];
            const events = appData.events.filter(e => e.date === dateStr).sort((a,b) => a.startTime.localeCompare(b.startTime));
            listEl.innerHTML = '';
            
            if(events.length === 0) {
                listEl.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-zinc-600 opacity-50"><i data-lucide="coffee" size="32" class="mb-2"></i><span class="font-zh text-sm tracking-widest">本日無行程</span></div>`;
                lucide.createIcons(); return;
            }

            const conflicts = new Set();
            for(let i=0; i<events.length; i++) {
                for(let j=i+1; j<events.length; j++) {
                    if (events[i].startTime < events[j].endTime && events[i].endTime > events[j].startTime) {
                        conflicts.add(events[i].id); conflicts.add(events[j].id);
                    }
                }
            }

            events.forEach(e => {
                let borderClass = 'border-l-[#c5a059]';
                let typeLabel = '演出';
                
                if(e.type === 'lesson') { borderClass = 'border-l-blue-400'; typeLabel = '家教'; }
                if(e.type === 'school') { borderClass = 'border-l-emerald-400'; typeLabel = '學校'; }
                if(e.type === 'rehearsal') { borderClass = 'border-l-orange-400'; typeLabel = '彩排'; }
                
                const isConflict = conflicts.has(e.id);

                const item = document.createElement('div');
                item.className = `glass p-4 rounded-2xl relative group active:scale-[0.98] transition border-l-4 ${borderClass} ${isConflict ? 'ring-1 ring-red-500/80 shadow-[0_0_15px_rgba(220,38,38,0.2)]' : ''}`;
                item.onclick = () => openEventModal(e.id);
                item.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-zh font-bold bg-white/5 px-2 py-0.5 rounded text-zinc-400 border border-white/5">${typeLabel}</span>
                            <span class="text-sm text-[#c5a059] font-num font-bold">${e.startTime} - ${e.endTime}</span>
                        </div>
                        ${isConflict ? `
                            <button onclick="event.stopPropagation(); openSubModal()" class="flex items-center gap-1 bg-red-500/20 border border-red-500/50 text-red-400 px-2 py-1 rounded-full text-[10px] font-bold font-zh animate-pulse hover:bg-red-500 hover:text-white transition">
                                <i data-lucide="alert-triangle" size="10"></i> 衝突！找代課
                            </button>
                        ` : ''}
                    </div>
                    <h3 class="text-xl text-[#e8e6e3] font-bold font-zh mb-1 leading-snug tracking-wide">${e.title}</h3>
                    <div class="flex flex-wrap gap-3 mt-3 text-xs text-zinc-400 font-zh">
                        ${e.location ? `<div class="flex items-center gap-1"><i data-lucide="map-pin" size="12"></i> ${e.location}</div>` : ''}
                        ${e.dressCode ? `<div class="flex items-center gap-1 text-[#c5a059]"><i data-lucide="shirt" size="12"></i> ${e.dressCode}</div>` : ''}
                        ${e.perfType ? `<div class="flex items-center gap-1 text-zinc-300 bg-white/5 px-2 rounded border border-white/10">${e.perfType}</div>` : ''}
                        ${e.fee ? `<div class="flex items-center gap-1 text-[#c5a059] font-num font-bold ml-auto">$${e.fee}</div>` : ''}
                    </div>
                `;
                listEl.appendChild(item);
            });
            lucide.createIcons();
        }

        // --- SETTINGS / DATA ---
        function openSettings() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function exportData() {
            const dataStr = JSON.stringify(appData);
            navigator.clipboard.writeText(dataStr).then(() => alert('資料已複製到剪貼簿，請貼上到安全的地方保存！'));
        }
        function importData() {
            const json = prompt("請貼上備份的資料代碼 (JSON):");
            if (json) {
                try {
                    const parsed = JSON.parse(json);
                    if(parsed.events && parsed.profiles) {
                        appData = parsed;
                        saveData();
                        alert("資料還原成功！");
                        closeModal('modal-settings');
                    } else { alert("格式錯誤"); }
                } catch(e) { alert("資料格式無效"); }
            }
        }

        // --- TEACHING ---
        function renderTeaching(filterType = 'student') {
            const list = document.getElementById('teaching-list');
            const data = appData.profiles.filter(p => p.type === filterType);
            list.innerHTML = '';
            if(data.length === 0) { list.innerHTML = `<div class="text-center py-10 text-zinc-600 font-zh text-sm">暫無資料</div>`; return; }
            data.forEach(p => {
                const item = document.createElement('div');
                item.className = 'glass p-4 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-white/5 active:scale-[0.98] transition border border-white/5';
                item.onclick = () => openProfileDetail(p.id);
                item.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-[#181614] border border-[#c5a059]/30 flex items-center justify-center text-[#c5a059] text-lg font-bold font-zh shadow-inner">${p.name[0]}</div>
                        <div>
                            <div class="text-[#e8e6e3] font-bold font-zh text-base">${p.name}</div>
                            <div class="text-xs text-zinc-500 font-zh mt-0.5">${p.contact || '無備註'}</div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function openProfileDetail(id) {
            activeProfileId = id;
            const p = appData.profiles.find(x => x.id === id);
            if(!p) return;
            document.getElementById('det-name').innerText = p.name;
            document.getElementById('det-info').innerText = `${p.type==='student'?'家教':'學校'} • ${p.contact}`;
            
            const history = appData.events.filter(e => e.refId === id).sort((a,b) => b.date.localeCompare(a.date));
            const histEl = document.getElementById('det-history');
            histEl.innerHTML = '';
            if(history.length === 0) histEl.innerHTML = '<div class="text-zinc-600 text-xs font-zh">尚無上課紀錄</div>';
            
            history.forEach(h => {
                const row = document.createElement('div');
                row.className = 'border-l-2 border-white/10 pl-4 py-2 relative';
                row.innerHTML = `
                    <div class="absolute -left-[5px] top-3 w-2.5 h-2.5 rounded-full bg-[#c5a059]"></div>
                    <div class="flex justify-between items-center mb-1">
                        <div class="text-sm text-[#c5a059] font-num font-bold">${h.date}</div>
                        <button onclick="openReportGen('${h.id}')" class="text-[10px] bg-white/5 border border-white/10 px-2 py-1 rounded text-zinc-400 hover:text-white transition">LINE 匯報</button>
                    </div>
                    <div class="text-sm text-white font-zh font-bold">${h.title}</div>
                    ${h.report ? `<div class="bg-black/30 p-2 rounded mt-2 text-[11px] text-zinc-400 font-zh whitespace-pre-wrap">${h.report}</div>` : ''}
                `;
                histEl.appendChild(row);
            });
            openModal('modal-detail');
        }

        // --- STAGE ---
        function renderStage() {
            const list = document.getElementById('stage-list');
            const events = appData.events.filter(e => e.type === 'performance').sort((a,b) => b.date.localeCompare(a.date));
            list.innerHTML = '';
            if(events.length === 0) { list.innerHTML = `<div class="text-center py-10 text-zinc-600 font-zh text-sm">尚無演出安排</div>`; return; }
            events.forEach(e => {
                const item = document.createElement('div');
                item.className = 'glass p-5 rounded-2xl border-l-4 border-[#c5a059] relative overflow-hidden mb-3';
                item.onclick = () => openEventModal(e.id);
                item.innerHTML = `
                    <div class="relative z-10">
                        <div class="flex justify-between mb-2">
                            <span class="text-[10px] font-zh font-bold bg-[#c5a059]/10 text-[#c5a059] px-2 py-0.5 rounded border border-[#c5a059]/20">${e.perfType || '演出'}</span>
                            <span class="text-xs text-zinc-500 font-num font-bold">${e.date}</span>
                        </div>
                        <h3 class="text-xl text-[#e8e6e3] font-bold font-zh mb-3">${e.title}</h3>
                        <div class="grid grid-cols-2 gap-3 text-xs text-zinc-400 font-zh bg-black/20 p-3 rounded-xl border border-white/5">
                            <div class="flex items-center gap-2"><i data-lucide="clock" size="12"></i> <span class="font-num font-bold text-sm">${e.startTime}</span></div>
                            <div class="flex items-center gap-2"><i data-lucide="map-pin" size="12"></i> ${e.location}</div>
                            <div class="col-span-2 text-[#c5a059] font-bold border-t border-white/5 pt-2 mt-1 flex items-center gap-2"><i data-lucide="shirt" size="12"></i> 服裝：${e.dressCode || '未定'}</div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        // --- FINANCE ---
        function renderFinance() {
            const list = document.getElementById('finance-list');
            const events = appData.events.filter(e => Number(e.fee) > 0).sort((a,b) => b.date.localeCompare(a.date));
            let pending = 0; let received = 0;
            events.forEach(e => { if(e.isPaid) received += Number(e.fee); else pending += Number(e.fee); });
            document.getElementById('fin-pending').innerText = `NT$ ${pending.toLocaleString()}`;
            document.getElementById('fin-received').innerText = `NT$ ${received.toLocaleString()}`;
            list.innerHTML = '';
            events.forEach(e => {
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-xl border mb-2 transition cursor-pointer select-none ${e.isPaid ? 'bg-black/20 border-transparent opacity-50' : 'bg-white/5 border-white/5 hover:bg-white/10'}`;
                item.onclick = () => { 
                    const ev = appData.events.find(x => x.id === e.id); 
                    if(ev) { ev.isPaid = !ev.isPaid; saveData(); } 
                };
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-lg border ${e.isPaid ? 'bg-[#c5a059] border-[#c5a059]' : 'border-zinc-500'} flex items-center justify-center transition-colors">
                            ${e.isPaid ? '<i data-lucide="check" size="14" class="text-[#12100e]"></i>' : ''}
                        </div>
                        <div>
                            <div class="text-base text-[#e8e6e3] font-zh font-bold ${e.isPaid ? 'line-through text-zinc-500' : ''}">${e.title}</div>
                            <div class="text-[10px] text-zinc-500 font-num font-bold mt-0.5 flex items-center gap-2">
                                <span>${e.date}</span>
                                ${e.finNote ? '• '+e.finNote : ''}
                            </div>
                        </div>
                    </div>
                    <div class="text-lg font-bold font-num ${e.isPaid ? 'text-zinc-600' : 'text-[#c5a059]'}">$${Number(e.fee).toLocaleString()}</div>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        // --- EVENT CRUD ---
        function openEventModal(id = null, forceType = null, refId = null) {
            closeActionSheet(); closeModal('modal-detail');
            editingEventId = id;
            document.getElementById('modal-event').classList.remove('hidden');
            
            // Defaults
            document.getElementById('evt-title').value = '';
            document.getElementById('evt-location').value = '';
            document.getElementById('evt-dress').value = '';
            document.getElementById('evt-fee').value = '';
            document.getElementById('evt-fin-note').value = '';
            document.getElementById('evt-recur-weeks').value = 1;
            document.getElementById('evt-recur-check').checked = false;
            toggleRecurInput(document.getElementById('evt-recur-check'));
            
            document.getElementById('evt-date').value = viewDate.toISOString().split('T')[0];
            document.getElementById('evt-start').value = '10:00';
            document.getElementById('evt-end').value = '12:00';
            document.getElementById('evt-rehearsal-count').value = '0';
            document.getElementById('rehearsal-inputs').innerHTML = '';
            document.getElementById('rehearsal-inputs').classList.add('hidden');

            let type = forceType || 'lesson';
            let studentId = refId;

            if (id) { // Edit
                const e = appData.events.find(x => x.id === id);
                document.getElementById('modal-event-title').innerText = "編輯行程";
                document.getElementById('btn-delete-evt').classList.remove('hidden');
                document.getElementById('section-recur').classList.add('hidden'); 
                type = e.type;
                studentId = e.refId;
                document.getElementById('evt-title').value = e.title;
                document.getElementById('evt-date').value = e.date;
                document.getElementById('evt-start').value = e.startTime;
                document.getElementById('evt-end').value = e.endTime;
                document.getElementById('evt-location').value = e.location;
                document.getElementById('evt-fee').value = e.fee;
                document.getElementById('evt-fin-note').value = e.finNote || '';
                document.getElementById('evt-dress').value = e.dressCode || '';
                if(e.perfType) document.getElementById('evt-perf-type').value = e.perfType;
            } else { // New
                document.getElementById('modal-event-title').innerText = "新增行程";
                document.getElementById('btn-delete-evt').classList.add('hidden');
                if (studentId) {
                    const p = appData.profiles.find(x => x.id === studentId);
                    if(p) document.getElementById('evt-title').value = p.name + (p.type === 'school' ? ' 分部課' : ' 大提琴課');
                }
            }

            document.getElementById('evt-type').value = type;
            document.getElementById('evt-ref-id').value = studentId || '';
            
            const secStudent = document.getElementById('section-student');
            const secTitle = document.getElementById('section-title');
            const secPerf = document.getElementById('section-performance');
            const secRecur = document.getElementById('section-recur');

            document.querySelectorAll('.btn-type').forEach(b => {
                b.classList.remove('active');
                if(b.innerText.includes('家教') && (type==='lesson'||type==='school')) b.classList.add('active');
                if(b.innerText.includes('演出') && type==='performance') b.classList.add('active');
            });

            if (type === 'performance') {
                secStudent.classList.add('hidden');
                secTitle.classList.remove('hidden');
                secPerf.classList.remove('hidden');
                secRecur.classList.add('hidden');
                document.getElementById('lbl-title').innerText = "演出主題";
            } else {
                secPerf.classList.add('hidden');
                if(!id && !studentId) {
                    secStudent.classList.remove('hidden');
                    secTitle.classList.add('hidden');
                    secRecur.classList.remove('hidden');
                    populateStudentsDropdown();
                } else {
                    secStudent.classList.add('hidden');
                    secTitle.classList.remove('hidden');
                    if(!id) secRecur.classList.remove('hidden');
                    document.getElementById('lbl-title').innerText = "課程名稱";
                }
            }
        }

        function setEventType(type, btn) { openEventModal(null, type); }

        function populateStudentsDropdown() {
            const sel = document.getElementById('evt-student');
            sel.innerHTML = '<option value="">請選擇對象...</option>' + 
                appData.profiles.map(p => `<option value="${p.id}">${p.name} (${p.type==='school'?'學校':'學生'})</option>`).join('');
        }

        function autoFillStudent() {
            const pid = document.getElementById('evt-student').value;
            const p = appData.profiles.find(x => x.id == pid);
            if(p) {
                document.getElementById('evt-title').value = p.name + (p.type === 'school' ? ' 分部課' : ' 大提琴課');
                document.getElementById('evt-ref-id').value = p.id;
                document.getElementById('evt-type').value = p.type === 'school' ? 'school' : 'lesson';
            }
        }

        function toggleRehearsalInputs() {
            const count = parseInt(document.getElementById('evt-rehearsal-count').value);
            const container = document.getElementById('rehearsal-inputs');
            const mainDate = document.getElementById('evt-date').value;
            const mainStart = document.getElementById('evt-start').value;
            const mainEnd = document.getElementById('evt-end').value;

            container.innerHTML = '';
            
            if(count > 0) {
                container.classList.remove('hidden');
                for(let i=1; i<=count; i++) {
                    container.innerHTML += `
                        <div class="grid grid-cols-7 gap-2 items-center">
                            <span class="text-[10px] text-zinc-500 font-zh col-span-1">彩排${i}</span>
                            <input type="date" value="${mainDate}" class="reh-date col-span-3 p-3 rounded-xl text-sm bg-black/30 text-white font-cinzel-force">
                            <input type="time" value="${mainStart}" class="reh-time col-span-3 p-3 rounded-xl text-sm bg-black/30 text-white font-cinzel-force">
                        </div>
                    `;
                }
            } else {
                container.classList.add('hidden');
            }
        }

        function toggleRecurInput(chk) {
            const group = document.getElementById('recur-input-group');
            const input = document.getElementById('evt-recur-weeks');
            if(chk.checked) {
                group.classList.remove('opacity-50');
                input.disabled = false;
            } else {
                group.classList.add('opacity-50');
                input.disabled = true;
            }
        }

        function saveEvent() {
            const title = document.getElementById('evt-title').value;
            const date = document.getElementById('evt-date').value;
            if(!title || !date) return alert('請填寫完整');
            
            const type = document.getElementById('evt-type').value;
            const recurChecked = document.getElementById('evt-recur-check').checked;
            const weeks = recurChecked ? (parseInt(document.getElementById('evt-recur-weeks').value) || 1) : 1;
            
            const base = {
                title, date, type,
                startTime: document.getElementById('evt-start').value,
                endTime: document.getElementById('evt-end').value,
                location: document.getElementById('evt-location').value,
                fee: Number(document.getElementById('evt-fee').value) || 0,
                finNote: document.getElementById('evt-fin-note').value,
                refId: document.getElementById('evt-ref-id').value ? parseInt(document.getElementById('evt-ref-id').value) : null,
                dressCode: document.getElementById('evt-dress').value,
                perfType: type === 'performance' ? document.getElementById('evt-perf-type').value : null,
                isPaid: false
            };

            if (editingEventId) {
                const idx = appData.events.findIndex(e => e.id === editingEventId);
                if(idx !== -1) appData.events[idx] = { ...appData.events[idx], ...base };
            } else {
                appData.events.push({ ...base, id: Date.now() });

                if (type === 'performance') {
                    const rehDates = document.querySelectorAll('.reh-date');
                    const rehTimes = document.querySelectorAll('.reh-time');
                    rehDates.forEach((d, idx) => {
                        if(d.value && rehTimes[idx].value) {
                            appData.events.push({
                                ...base,
                                id: Date.now() + idx + 1,
                                title: `${title} (彩排 ${idx+1})`,
                                type: 'rehearsal',
                                date: d.value,
                                startTime: rehTimes[idx].value,
                                endTime: '', 
                                fee: 0 
                            });
                        }
                    });
                } 
                else if (recurChecked && weeks > 1) {
                    for(let i=1; i<weeks; i++) {
                        const d = new Date(date); d.setDate(d.getDate() + (i*7));
                        appData.events.push({ ...base, id: Date.now()+i, date: d.toISOString().split('T')[0] });
                    }
                }
            }
            saveData(); closeModal('modal-event');
            if(activeProfileId) openProfileDetail(activeProfileId);
        }

        function deleteEvent() {
            if(confirm('確定刪除？')) {
                appData.events = appData.events.filter(e => e.id !== editingEventId);
                saveData(); closeModal('modal-event');
                if(activeProfileId) openProfileDetail(activeProfileId);
            }
        }

        // --- PROFILE ---
        function openProfileModal(type) {
            closeActionSheet();
            document.getElementById('prof-type').value = type;
            document.getElementById('modal-profile-title').innerText = type === 'student' ? '新增學生資料' : '新增學校資料';
            
            if(type === 'school') {
                document.getElementById('lbl-prof-name').innerText = '學校名稱';
                document.getElementById('lbl-prof-contact').innerText = '聯絡窗口/行政';
            } else {
                document.getElementById('lbl-prof-name').innerText = '學生姓名';
                document.getElementById('lbl-prof-contact').innerText = '家長稱呼';
            }

            ['prof-name','prof-contact','prof-phone','prof-addr','prof-email'].forEach(id => document.getElementById(id).value = '');
            openModal('modal-profile');
        }
        function saveProfile() {
            const name = document.getElementById('prof-name').value;
            if(!name) return;
            appData.profiles.push({
                id: Date.now(),
                type: document.getElementById('prof-type').value,
                name,
                contact: document.getElementById('prof-contact').value,
                phone: document.getElementById('prof-phone').value,
                address: document.getElementById('prof-addr').value,
                email: document.getElementById('prof-email').value
            });
            saveData(); closeModal('modal-profile');
        }
        function deleteProfile() {
            if(confirm('刪除資料會一併刪除相關紀錄，確定？')) {
                appData.profiles = appData.profiles.filter(p => p.id !== activeProfileId);
                saveData(); closeModal('modal-detail');
            }
        }
        function openEventModalForDetail() {
            if(!activeProfileId) return;
            const p = appData.profiles.find(x => x.id === activeProfileId);
            openEventModal(null, p.type==='school'?'school':'lesson', activeProfileId);
        }

        // --- REPORT ---
        function openReportGen(evtId) {
            currentReportEventId = parseInt(evtId);
            openModal('modal-report');
        }
        function generateAndCopyReport() {
            const prog = document.getElementById('rep-progress').value;
            const comment = document.getElementById('rep-comment').value;
            const hw = document.getElementById('rep-homework').value;
            const next = document.getElementById('rep-next').value;
            
            const ev = appData.events.find(e => e.id === currentReportEventId);
            const title = ev ? ev.title : '課程';
            const text = `【${title} 課後報告】\n\n進度：${prog}\n老師的話：\n${comment}\n作業：${hw}\n${next ? '\n下週上課：'+next : ''}\n\n謝謝！`;
            
            if(ev) ev.report = text;
            saveData();
            
            navigator.clipboard.writeText(text).then(() => alert('已複製 Line 文字！'));
            closeModal('modal-report');
            if(activeProfileId) openProfileDetail(activeProfileId);
        }

        // --- SUBSTITUTE ---
        function renderSubs() {
            const list = document.getElementById('sub-list');
            list.innerHTML = appData.subs.map(s => `
                <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                    <div>
                        <div class="text-white text-sm font-zh font-bold">${s.name}</div>
                        <div class="text-xs text-zinc-500 font-en">${s.phone}</div>
                    </div>
                    <div class="flex gap-2">
                        <a href="tel:${s.phone}" class="bg-green-600/20 text-green-500 p-2 rounded-lg"><i data-lucide="phone" size="16"></i></a>
                        <button onclick="delSub(${s.id})" class="text-red-500 p-2"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        function openSubModal() { renderSubs(); openModal('modal-sub'); }
        function addSub() {
            const name = document.getElementById('sub-name').value;
            const phone = document.getElementById('sub-phone').value;
            if(name) {
                appData.subs.push({ id: Date.now(), name, phone });
                document.getElementById('sub-name').value = '';
                document.getElementById('sub-phone').value = '';
                saveData();
                renderSubs();
            }
        }
        function delSub(id) {
            appData.subs = appData.subs.filter(s => s.id !== id);
            saveData();
            renderSubs();
        }

        // --- UI ---
        function switchTab(viewId, btn) {
            ['view-schedule', 'view-teaching', 'view-stage', 'view-finance'].forEach(id => document.getElementById(id).classList.add('hidden-tab'));
            document.getElementById(viewId).classList.remove('hidden-tab');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }
        function openActionSheet() { document.getElementById('action-sheet-overlay').classList.remove('hidden','opacity-0'); document.getElementById('action-sheet').classList.remove('translate-y-full'); }
        function closeActionSheet() { document.getElementById('action-sheet-overlay').classList.add('opacity-0'); document.getElementById('action-sheet').classList.add('translate-y-full'); setTimeout(()=>document.getElementById('action-sheet-overlay').classList.add('hidden'),300); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function filterTeaching(type, btn) {
            document.querySelectorAll('.t-filter').forEach(b => { b.classList.remove('bg-[#c5a059]','text-[#12100e]'); b.classList.add('text-zinc-500'); });
            btn.classList.remove('text-zinc-500'); btn.classList.add('bg-[#c5a059]','text-[#12100e]');
            renderTeaching(type);
        }

        switchTab('view-schedule', document.querySelector('.nav-btn.active'));
    </script>
</body>
</html>
